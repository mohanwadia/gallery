name: Build gallery
on:
  push:
    paths: ["_incoming/**", "fussel-config.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx fussel --config fussel-config.yml
      - name: Commit output
        run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Build gallery" && git push)